name: Keep dashboard awake

on:
  schedule:
    # Every 6 hours; Streamlit Community Cloud sleeps apps that get no visits.
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  open-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open the Streamlit app in a browser
        run: python .github/scripts/wake_app.py
